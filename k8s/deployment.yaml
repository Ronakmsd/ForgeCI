apiVersion: apps/v1
kind: Deployment
metadata:
  name: forgeci-demo
  labels:
    app: forgeci-demo
spec:
  replicas: 2
  selector:
    matchLabels:
      app: forgeci-demo
  template:
    metadata:
      labels:
        app: forgeci-demo
    spec:
      containers:
        - name: forgeci-demo
          image: forgeci-demo:local
          imagePullPolicy: Never
          ports:
            - containerPort: 8000
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 3
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "200m"
              memory: "256Mi"
